# The same gate as .claude/hooks/pre-push-check.sh, but enforced for every
# push and PR regardless of who (or what) made it. The hook only runs inside
# Claude Code sessions; a human pushing from a terminal — or a squash-merge
# in the GitHub UI — used to bypass it entirely, which is how `main` ended up
# with lint failing (2026-09-04).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (lockfile must be in sync)
        run: bun install --frozen-lockfile

      - name: Validate content schema
        run: bun run scripts/validate-nodes.ts --quiet

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Bundle size limit
        # Hard limit since the data-layer split (TECH_DEBT §2, 2026-09-04):
        # the largest client chunk is ~206 KB gzipped, down from 442 KB. The
        # limit is set ~25% above that so normal feature work fits but
        # accidentally bundling the node bodies (or another 100 KB of content
        # into the index) fails loudly instead of silently regressing.
        env:
          LIMIT_KB: 260
        run: |
          max=0; maxf=""
          {
            echo "### Client bundle (gzipped, limit ${LIMIT_KB} KB per chunk)"
            echo '```'
            for f in dist/client/assets/*.js; do
              kb=$(( $(gzip -c "$f" | wc -c) / 1024 ))
              if [ "$kb" -gt "$max" ]; then max=$kb; maxf=$(basename "$f"); fi
              printf "%8s KB  %s\n" "$kb" "$(basename "$f")"
            done | sort -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "largest chunk: ${maxf} = ${max} KB gz"
          if [ "$max" -gt "$LIMIT_KB" ]; then
            echo "::error::${maxf} is ${max} KB gzipped, over the ${LIMIT_KB} KB limit. Did the node bodies end up in the bundle? See docs/CONTENT-LAYER.md."
            exit 1
          fi
